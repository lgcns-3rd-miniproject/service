name: Deploy RestArea-Unit Service

on:
  push:
    branches:
      - stg
    paths:
      - 'restarea-unit/**'
      - '.github/workflows/deploy-restarea-unit.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./restarea-unit
          file: ./restarea-unit/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/mp3-service-restarea-unit:stg
            ${{ secrets.DOCKER_USERNAME }}/mp3-service-restarea-unit:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mp3-service-restarea-unit:stg
          cache-to: type=inline

      - name: Deploy to AWS Instance
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /path/to/docker-compose
            docker-compose pull mp3-service-restarea-unit
            docker-compose up -d mp3-service-restarea-unit
            docker image prune -f
