spring:
  application:
    name: openai-service

  # maria db    
  datasource:
    driver-class-name: ${SPRING_DRIVER}
    url: ${SPRING_URL}
    username: ${SPRING_USERNAME}
    password: ${SPRING_PASSWORD}
    hikari:
      # 15분
      max-lifetime: 1500000   
      # 10
      idle-timeout: 600000 
  
  jpa:
    hibernate:
    # create, create-drop, update, none
      ddl-auto: none
    # 콘솔출력
    # show-sql: true
    properties:
      hibernate:
        # mariadb
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
  config:
    import: optional:file:.env[.properties]
      
server:
  port: 8080

openai:
  api-key: ${OPEN_AI_KEY}
  url: ${OPEN_AI_URL}
  model: ${OPEN_AI_MODEL}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8765/eureka/}
  instance:
    prefer-ip-address: true